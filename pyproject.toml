[project]
name = "thoughtform"
version = "0.1.0"
description = "Individual model definitions and model-neutral agency."
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
thoughtform = "thoughtform:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
thoughtformula = ["thoughtformula @ git+https://github.com/wispsy/thoughtformula.git@5ce72f850772c2467f0a0909dfd5c81874065684"]

[project.urls]
Source = "https://github.com/wispsy/thoughtform"
Project = "https://github.com/orgs/wispsy/projects/28"

[tool.uv.build-backend]
source-include = ["tests/**", "scripts/**", "IMPLEMENTATION_PLAN.md"]
